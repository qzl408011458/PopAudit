# Conda environment for the PopAudit release.  Versions are the ones the paper's results were produced
# with (Python 3.12.12, Linux, CUDA 12.1).  Only packages imported by the released code are listed
# (plus accelerate, which transformers needs for device_map=..., and the solver back-ends of cvxpy).
#   conda env create -f environment.yml && conda activate popaudit
name: popaudit
channels:
  - conda-forge
dependencies:
  - python=3.12.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.3.0+cu121
      - numpy==2.3.5
      - pandas==2.3.3
      - scipy==1.16.3
      - scikit-learn==1.8.0
      - statsmodels==0.14.6
      - pyyaml==6.0.3
      - tqdm==4.67.1
      - matplotlib==3.10.7
      - pyarrow==24.0.0
      - cvxpy==1.9.0
      - clarabel==0.11.1
      - ecos==2.0.14
      - osqp==1.1.1
      - scs==3.2.11
      - optuna==4.5.0
      - pgmpy==1.1.2
      - ctgan==0.11.1
      - sdv==1.32.0
      - isotree==0.6.1.post10
      - transformers==4.51.1
      - accelerate==1.10.1
